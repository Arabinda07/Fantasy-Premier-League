name: Constitutional CI & Quality Gates

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-constitutional-gates:
    name: Python Quality Gates (OKF, Attestation, Voice & Tone)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Gate 1: OKF v0.2 Schema & Link Conformance"
        run: |
          python scripts/validate_okf.py

      - name: "Gate 2: Voice, Tone & Copy Linter (Python Test Suite)"
        run: |
          python scripts/validate_frontend_copy.py
          pytest model/test_voice_and_tone.py

      - name: "Gate 3: Mathematical Attestation & Invariant Contracts"
        run: |
          python knowledge/references/attesters/verify_schema.py --season 2026-27 --gw 2
          python knowledge/references/attesters/verify_solver.py --season 2026-27 --gw 2

      - name: "Gate 4: Python Unit Test Suite"
        run: |
          pytest -v

  frontend-constitutional-gates:
    name: Frontend Quality Gates (Copy, Tests & Production Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: "Gate 2: Frontend Copy Linter (check-copy)"
        working-directory: frontend
        run: npm run check-copy

      - name: "Gate 3: Frontend Unit Tests (Optimizer, Metadata, Transfers)"
        working-directory: frontend
        run: npm test

      - name: "Gate 4: Serverless API Contract Tests"
        run: |
          node tests/test_api_sync.js

      - name: "Gate 5: Production Build Verification"
        working-directory: frontend
        run: npm run build

  notify-on-failure:
    name: Alert on CI Failure
    runs-on: ubuntu-latest
    needs: [python-constitutional-gates, frontend-constitutional-gates]
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `❌ CI Failed: ${context.workflow} #${context.runNumber}`;
            const body = [
              `### Workflow Failure`,
              ``,
              `| Field | Value |`,
              `|-------|-------|`,
              `| **Workflow** | ${context.workflow} |`,
              `| **Run** | [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |`,
              `| **Branch** | \`${context.ref.replace('refs/heads/', '')}\` |`,
              `| **Commit** | \`${context.sha.substring(0, 8)}\` |`,
              `| **Triggered by** | @${context.actor} |`,
              ``,
              `> Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for detailed failure logs.`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'automated'],
            });
